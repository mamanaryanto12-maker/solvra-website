<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%" style="background-color: #EDE9DF; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="60%" stop-color="#E7E2D6"/>
      <stop offset="100%" stop-color="#D9D2C2"/>
    </linearGradient>
    <linearGradient id="timberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#554238"/>
      <stop offset="100%" stop-color="#3D2E27"/>
    </linearGradient>
  </defs>

  <rect width="700" height="850" fill="url(#lightGradient)"/>

  <!-- Studio Background: Dinding beton mentah & bayangan jendela pagi -->
  <line x1="0" y1="280" x2="700" y2="280" stroke="#DFD9CB" stroke-width="0.75"/>
  <line x1="0" y1="560" x2="700" y2="560" stroke="#DFD9CB" stroke-width="0.75"/>

  <!-- Bias cahaya matahari pagi dari jendela clerestory tinggi -->
  <polygon points="120,0 480,0 700,500 700,850 350,850" fill="#FFFDF8" opacity="0.45"/>

  <!-- Elemen Studio Arsitektur -->
  <rect x="580" y="80" width="8" height="260" fill="#DDD6C4" stroke="#C5BCA7" stroke-width="0.5"/>
  <rect x="600" y="60" width="8" height="300" fill="#E4DEC8" stroke="#C5BCA7" stroke-width="0.5"/>

  <!-- Maket Studi di Rak Kayu -->
  <rect x="40" y="320" width="160" height="12" fill="#D3CBBB"/>
  <polygon points="60,320 80,260 140,260 120,320" fill="#E2DDD0" stroke="#B8B0A0" stroke-width="0.8"/>
  <polygon points="140,260 180,260 160,320 120,320" fill="#D5CEBE" stroke="#B8B0A0" stroke-width="0.8"/>

  <!-- Sosok: Dipta Wirawan (Cahaya alami, bersahaja di meja gambar kayu) -->
  <path d="M 220 850 C 220 720 250 630 330 590 C 370 570 430 570 470 590 C 550 630 580 720 580 850 Z" fill="#242321"/>
  
  <path d="M 375 580 L 375 520 C 375 510 425 510 425 520 L 425 580 Z" fill="#D8C2B0"/>
  <polygon points="360,575 400,620 440,575 425,565 400,590 375,565" fill="#F4EDE2"/>

  <!-- Kepala & Kacamata Kawat Tipis -->
  <ellipse cx="400" cy="420" rx="65" ry="85" fill="#DEC6B4"/>
  <path d="M 330 400 C 330 320 370 310 410 310 C 460 310 480 340 480 410 C 460 380 430 360 400 360 C 360 360 340 380 330 400 Z" fill="#1A1918"/>
  <rect x="360" y="405" width="35" height="24" rx="1" fill="none" stroke="#524E48" stroke-width="2"/>
  <rect x="408" y="405" width="35" height="24" rx="1" fill="none" stroke="#524E48" stroke-width="2"/>
  <line x1="395" y1="417" x2="408" y2="417" stroke="#524E48" stroke-width="1.8"/>

  <!-- Meja Gambar Kayu Jati Tua -->
  <path d="M 0 710 L 700 710 L 700 850 L 0 850 Z" fill="url(#timberGrad)"/>
  <line x1="0" y1="710" x2="700" y2="710" stroke="#7A6255" stroke-width="2"/>

  <!-- Kertas Kalkir Gambar Kerja, Penggaris Skala & Pensil -->
  <polygon points="120,740 450,725 470,820 140,840" fill="#FDFBF7" stroke="#D3CCC0" stroke-width="0.8"/>
  <line x1="160" y1="760" x2="380" y2="750" stroke="#C0B8AA" stroke-width="0.6"/>
  <line x1="160" y1="780" x2="410" y2="770" stroke="#C0B8AA" stroke-width="0.6"/>
  <polygon points="460,780 620,760 622,768 462,788" fill="#FFFFFF" stroke="#8C8476" stroke-width="0.8"/>
  <line x1="462" y1="784" x2="621" y2="764" stroke="#A64B2A" stroke-width="1.2"/>

  <!-- Keterangan Pelat Foto Studio -->
  <text x="35" y="810" font-size="11" font-weight="600" fill="#DDD2C4" letter-spacing="1">DIPTA WIRAWAN, IAI</text>
  <text x="35" y="828" font-size="9.5" fill="#B3A595">Pendiri &amp; Arsitek Utama — Ruang Antara Studio, Bandung</text>
</svg>
