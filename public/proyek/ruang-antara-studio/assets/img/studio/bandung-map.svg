<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #F3EFE6; font-family: 'Plus Jakarta Sans', sans-serif;">
  <defs>
    <pattern id="mapGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ECE8DC" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD8C8"/>
      <stop offset="100%" stop-color="#D0C9B6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#F4EFE6"/>
  <rect width="800" height="450" fill="url(#mapGrid)"/>

  <!-- Mountain Contours (Dago Atas / Northern Bandung Foothills) -->
  <path d="M 0 60 Q 200 80 400 50 T 800 30" fill="none" stroke="#E5DFD1" stroke-width="1.2"/>
  <path d="M 0 110 Q 250 140 500 95 T 800 70" fill="none" stroke="#E5DFD1" stroke-width="1"/>
  <path d="M 0 160 Q 220 190 480 145 T 800 120" fill="none" stroke="#E5DFD1" stroke-width="0.8"/>
  <path d="M 0 220 Q 300 240 550 195 T 800 180" fill="none" stroke="#E5DFD1" stroke-width="0.8"/>
  <text x="730" y="45" font-size="8.5" fill="#B0A997" font-family="'JetBrains Mono', monospace">ELEV. 820M</text>
  <text x="730" y="105" font-size="8.5" fill="#B0A997" font-family="'JetBrains Mono', monospace">ELEV. 780M</text>
  <text x="730" y="165" font-size="8.5" fill="#B0A997" font-family="'JetBrains Mono', monospace">ELEV. 740M</text>

  <!-- Greenery & Canopy Reserves (Taman Hutan Raya Juanda / Curug Dago zone) -->
  <path d="M 350 0 C 450 30 550 10 650 50 C 720 80 760 140 800 160 L 800 0 Z" fill="#E8E2D2" opacity="0.6"/>
  <text x="590" y="35" font-size="8" fill="#9C9583" letter-spacing="1.5">FOREST RESERVE (TAHURA)</text>

  <!-- Cikapundung River Curve -->
  <path d="M 180 0 Q 210 120 170 210 T 260 350 T 210 450" fill="none" stroke="url(#riverGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 180 0 Q 210 120 170 210 T 260 350 T 210 450" fill="none" stroke="#CBC5B4" stroke-width="1.2" stroke-linecap="round"/>
  <text x="145" y="150" font-size="8" fill="#9E9684" transform="rotate(78 145 150)" letter-spacing="1.5">SUNGAI CIKAPUNDUNG</text>

  <!-- Secondary Streets (Quiet, warm grey architectural lines) -->
  <path d="M 0 340 L 420 310 L 800 370" fill="none" stroke="#E3DDD0" stroke-width="2.5"/>
  <path d="M 320 450 L 360 280 L 450 180 L 490 0" fill="none" stroke="#E3DDD0" stroke-width="2.5"/>
  <path d="M 100 450 L 150 300 L 280 230" fill="none" stroke="#E3DDD0" stroke-width="1.8"/>
  <path d="M 450 180 L 680 230 L 800 210" fill="none" stroke="#E3DDD0" stroke-width="2"/>

  <!-- Main Artery: Jl. Ir. H. Djuanda (Dago Main Road) -->
  <path d="M 290 450 L 330 310 L 410 200 L 470 90 L 510 0" fill="none" stroke="#DBD4C4" stroke-width="5"/>
  <path d="M 290 450 L 330 310 L 410 200 L 470 90 L 510 0" fill="none" stroke="#CDC5B2" stroke-width="1.2"/>
  <text x="310" y="380" font-size="8.5" fill="#8C8472" transform="rotate(-72 310 380)" letter-spacing="1">JL. IR. H. DJUANDA (DAGO)</text>

  <!-- Access Road: Jl. Bukit Dago Utara -->
  <path d="M 410 200 C 430 195 470 195 520 220 C 570 245 610 235 680 230" fill="none" stroke="#A64B2A" stroke-width="3" opacity="0.85"/>
  <text x="470" y="240" font-size="8" fill="#A64B2A" font-weight="600" letter-spacing="0.5">JL. BUKIT DAGO UTARA</text>

  <!-- Studio Location Pin & Target Callout -->
  <g transform="translate(540, 226)">
    <!-- Radar pulse rings -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#A64B2A" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4"/>
    <circle cx="0" cy="0" r="14" fill="#A64B2A" opacity="0.15"/>
    <circle cx="0" cy="0" r="7" fill="#A64B2A"/>
    <circle cx="0" cy="0" r="3" fill="#F7F5F0"/>

    <!-- Callout Box -->
    <line x1="0" y1="0" x2="35" y2="-45" stroke="#191817" stroke-width="1"/>
    <line x1="35" y1="-45" x2="190" y2="-45" stroke="#191817" stroke-width="1"/>
    <rect x="35" y="-90" width="165" height="42" fill="#F7F5F0" stroke="#191817" stroke-width="1"/>
    <text x="45" y="-74" font-size="9.5" font-weight="600" fill="#191817" letter-spacing="0.8">RUANG ANTARA STUDIO</text>
    <text x="45" y="-60" font-size="8" fill="#63605A">Jl. Bukit Dago Utara No. 28</text>
    <text x="45" y="-50" font-size="7.5" font-family="'JetBrains Mono', monospace" fill="#A64B2A">6°52'24.8"S 107°37'11.2"E</text>
  </g>

  <!-- Compass Rose / North Arrow (Architectural Minimalist) -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#191817" stroke-width="0.8"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#191817" stroke-width="1"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#191817" stroke-width="0.5"/>
    <polygon points="0,-28 -4,-12 4,-12" fill="#191817"/>
    <text x="0" y="-32" text-anchor="middle" font-size="8.5" font-weight="600" fill="#191817" font-family="'JetBrains Mono', monospace">N</text>
  </g>

  <!-- Scale Marker -->
  <g transform="translate(50, 415)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#191817" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#191817" stroke-width="1"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#191817" stroke-width="1"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#191817" stroke-width="1"/>
    <text x="0" y="-8" font-size="7.5" font-family="'JetBrains Mono', monospace" fill="#63605A">0</text>
    <text x="60" y="-8" text-anchor="middle" font-size="7.5" font-family="'JetBrains Mono', monospace" fill="#63605A">250m</text>
    <text x="120" y="-8" text-anchor="end" font-size="7.5" font-family="'JetBrains Mono', monospace" fill="#63605A">500m</text>
    <text x="0" y="16" font-size="8" fill="#7A7467">Bandung Utara Cartography — WGS84</text>
  </g>
</svg>
