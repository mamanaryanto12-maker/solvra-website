<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background-color: #F7F5F0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EAE7DF" stroke-width="0.75"/>
    </pattern>
    <pattern id="rosterHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="none" stroke="#A64B2A" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1000" height="560" fill="url(#grid3)"/>
  <rect x="25" y="25" width="950" height="510" fill="none" stroke="#D8D4C7" stroke-width="1"/>
  <rect x="28" y="28" width="944" height="504" fill="none" stroke="#ECE9DF" stroke-width="0.5"/>

  <!-- Garis Muka Jalan & Batas Belakang -->
  <line x1="30" y1="440" x2="970" y2="440" stroke="#191817" stroke-width="1.8"/>

  <!-- Dinding Batas Tetangga (Party Wall Kiri & Kanan Lahan Padat) -->
  <rect x="100" y="160" width="16" height="280" fill="#DDD7C8" stroke="#191817" stroke-width="1.5"/>
  <rect x="884" y="160" width="16" height="280" fill="#DDD7C8" stroke="#191817" stroke-width="1.5"/>
  <text x="75" y="300" text-anchor="middle" font-size="8" fill="#8C887B" transform="rotate(-90 75 300)">DINDING BATAS LAHAN</text>
  <text x="915" y="300" text-anchor="middle" font-size="8" fill="#8C887B" transform="rotate(-90 915 300)">DINDING BATAS LAHAN</text>

  <!-- Fasad Depan: Roster Tanah Liat Porus (Bata Berlubang / Brise-Soleil) -->
  <rect x="116" y="180" width="24" height="260" fill="url(#rosterHatch)" stroke="#A64B2A" stroke-width="1.2"/>
  <text x="128" y="320" text-anchor="middle" font-size="7.5" fill="#A64B2A" font-weight="600" transform="rotate(-90 128 320)">ROSTER TANAH LIAT PORUS</text>

  <!-- Area Carport & Teras Depan Terbuka -->
  <line x1="140" y1="340" x2="260" y2="340" stroke="#191817" stroke-width="1.4"/>
  <text x="190" y="420" text-anchor="middle" font-size="8" fill="#63605A">CARPORT PENYANGGA</text>

  <!-- Pelat Lantai Dasar & Tingkat -->
  <rect x="260" y="430" width="624" height="12" fill="#D3CEC2" stroke="#191817" stroke-width="1.4"/>

  <rect x="260" y="330" width="220" height="10" fill="#D3CEC2" stroke="#191817" stroke-width="1.4"/>
  <rect x="580" y="330" width="304" height="10" fill="#D3CEC2" stroke="#191817" stroke-width="1.4"/>

  <rect x="260" y="240" width="220" height="10" fill="#D3CEC2" stroke="#191817" stroke-width="1.4"/>
  <rect x="580" y="240" width="304" height="10" fill="#D3CEC2" stroke="#191817" stroke-width="1.4"/>

  <!-- VOID COURTYARD TRIPLE-HEIGHT (Paru-paru Rumah Infill Lebar 6 Meter) -->
  <rect x="480" y="140" width="100" height="300" fill="#FDFCF9" stroke="#A64B2A" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Pohon Ramping & Hamparan Kerikil Basah -->
  <line x1="530" y1="430" x2="530" y2="210" stroke="#686358" stroke-width="2"/>
  <ellipse cx="530" cy="200" rx="35" ry="45" fill="#DDD7C8" stroke="#7A7467" stroke-width="0.8" opacity="0.6"/>
  <circle cx="530" cy="430" r="14" fill="#C2B7A3"/>
  <text x="530" y="420" text-anchor="middle" font-size="7.5" fill="#63605A">KERIKIL KALI</text>

  <!-- Bukaan Skylight & Jalusi Ventilasi Puncak -->
  <path d="M 470 140 L 590 120 L 590 128 L 470 148 Z" fill="#3D3A35" stroke="#191817" stroke-width="1.4"/>
  <line x1="570" y1="120" x2="600" y2="105" stroke="#A64B2A" stroke-width="1.4"/>

  <!-- Notasi Program Ruang -->
  <!-- Lantai Dasar -->
  <text x="360" y="390" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">RUANG DUDUK / MAKAN</text>
  <text x="730" y="390" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">DAPUR &amp; SERVIS</text>
  <!-- Lantai 01 -->
  <text x="360" y="295" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">RUANG KERJA / PERPUSTAKAAN</text>
  <text x="730" y="295" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">KAMAR TIDUR 01</text>
  <!-- Lantai 02 -->
  <text x="360" y="200" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">KAMAR UTAMA</text>
  <text x="730" y="200" text-anchor="middle" font-size="8.5" fill="#191817" font-weight="600">TERAS ATAP</text>

  <!-- Arah Aliran Konveksi Udara Alami (Efek Cerobong) -->
  <path d="M 60 410 C 110 410 150 405 240 405" fill="none" stroke="#7A8B7B" stroke-width="1.4" stroke-dasharray="3 3"/>
  <polygon points="245,405 235,401 235,409" fill="#7A8B7B"/>
  <text x="80" y="398" font-size="8" fill="#586759">Masukan Udara Sejuk Segar</text>

  <!-- Aliran Udara Panas Naik Melalui Void -->
  <path d="M 500 400 C 510 320 500 240 520 150 C 525 125 540 100 560 90" fill="none" stroke="#A64B2A" stroke-width="1.6" stroke-dasharray="4 4"/>
  <polygon points="565,88 554,92 560,98" fill="#A64B2A"/>
  <text x="530" y="280" text-anchor="middle" font-size="9" fill="#A64B2A" font-weight="600" transform="rotate(-90 530 280)">EFEK CEROBONG KONVEKSI TERMAL</text>

  <!-- Masukan Cahaya Alami -->
  <polygon points="530,120 480,430 580,430" fill="#F4F0E4" opacity="0.45"/>

  <!-- Garis Ukuran Lahan -->
  <line x1="100" y1="480" x2="884" y2="480" stroke="#8C887B" stroke-width="0.8"/>
  <line x1="100" y1="475" x2="100" y2="485" stroke="#8C887B" stroke-width="0.8"/>
  <line x1="884" y1="475" x2="884" y2="485" stroke="#8C887B" stroke-width="0.8"/>
  <text x="492" y="495" text-anchor="middle" font-size="9.5" fill="#63605A" font-family="'JetBrains Mono', monospace">KEDALAMAN LAHAN 22.000 MM (LEBAR TAPAK 6.000 MM)</text>

  <!-- Kepala Gambar Baku -->
  <rect x="610" y="465" width="340" height="50" fill="#F7F5F0" stroke="#191817" stroke-width="1"/>
  <line x1="610" y1="490" x2="950" y2="490" stroke="#D8D4C7" stroke-width="0.8"/>
  <line x1="790" y1="465" x2="790" y2="515" stroke="#D8D4C7" stroke-width="0.8"/>
  <text x="620" y="482" font-size="9" font-weight="600" fill="#191817" letter-spacing="1">RUANG ANTARA STUDIO</text>
  <text x="620" y="505" font-size="8" fill="#63605A">PROYEK: RUMAH CIHAPIT, BANDUNG</text>
  <text x="800" y="482" font-size="8" fill="#63605A">GBR: VENTILASI MEMANJANG</text>
  <text x="800" y="505" font-size="8" font-family="'JetBrains Mono', monospace" fill="#A64B2A">SKALA: 1:75 @ A3</text>
</svg>
